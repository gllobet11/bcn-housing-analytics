services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: bcn_housing_clickhouse
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-raw}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clickhouse_data:
