version: 2

models:
  - name: dim_geography
    description: >
      Grano: un barrio de Barcelona (73 filas). Jerarquía ciudad > distrito > barrio,
      con el nombre de Inside Airbnb y el id/label de Barcelona Dades.
    columns:
      - name: barrio_id
        data_tests:
          - unique
          - not_null

  - name: dim_property_type
    description: >
      Grano: una combinación única de property_type x room_type de Inside Airbnb.
    columns:
      - name: property_type_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: "Grano: un día, del 2014-01-01 al 2027-12-31."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: fct_rent_quarter
    description: >
      Grano: barrio x trimestre. Alquiler medio €/mes y €/m² de Barcelona Dades,
      solo territorio Barri y periodo Trimestre.
    columns:
      - name: barrio_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_geography')
              field: barrio_id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [barrio_id, quarter_start]

  - name: fct_listing_snapshot
    description: >
      Grano: listing x snapshot trimestral de Inside Airbnb. Incremental
      (insert_overwrite por partición mensual): cada `dbt run` solo procesa
      snapshots posteriores al último cargado.
    columns:
      - name: listing_id
        data_tests:
          - not_null
      - name: barrio_id
        data_tests:
          - relationships:
              to: ref('dim_geography')
              field: barrio_id
      - name: property_type_id
        data_tests:
          - relationships:
              to: ref('dim_property_type')
              field: property_type_id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [listing_id, snapshot_date]

  - name: fct_price_changes
    description: >
      Grano: un cambio de precio por listing, detectado en `snp_listings`
      (snapshot SCD2 con estrategia `check` sobre price/room_type/availability_365).
    columns:
      - name: listing_id
        data_tests:
          - not_null
      - name: changed_at
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [listing_id, changed_at]

  - name: mart_barrio_quarter
    description: >
      Grano: barrio x trimestre. KPIs de negocio: anuncios activos, % de alojamiento
      entero, precio medio por noche, alquiler medio €/mes y €/m², y variación
      trimestral (QoQ) de cada uno.
    columns:
      - name: barrio_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [barrio_id, quarter_start]

  - name: fct_hut_registry
    description: >
      Grano: licencia HUT (nº HUTB) x snapshot trimestral del registro municipal.
      `barrio_id` por código oficial de barrio o, si el trimestre no lo trae, por
      nombre normalizado.
    columns:
      - name: hutb_num
        data_tests:
          - not_null
          # 0 = expediente sin nº HUTB colado por el coalesce de la sorting key
          - dbt_utils.accepted_range:
              min_value: 1
      - name: barrio_id
        data_tests:
          # ~0,1 % de expedientes vienen sin código ni nombre de barrio
          - not_null:
              config:
                severity: warn
          - relationships:
              to: ref('dim_geography')
              field: barrio_id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [snapshot_date, hutb_num]

  - name: fct_listing_license
    description: >
      Grano: listing x snapshot de Inside Airbnb. Licencia declarada clasificada
      (`license_type`) y, para los HUTB, contraste con el registro municipal vigente
      en esa fecha: si existe, si está en el mismo barrio, distancia, plazas, y
      cuántos anuncios y hosts comparten el mismo nº.
    columns:
      - name: listing_id
        data_tests:
          - not_null
      - name: license_type
        data_tests:
          - accepted_values:
              values:
                - hutb
                - registro_nacional_turistico
                - registro_nacional_no_turistico
                - exempt
                - sin_licencia
                - otra
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [listing_id, snapshot_date]

  - name: fct_hut_registry_barrio
    description: >
      Grano: barrio x snapshot trimestral del registro municipal de HUT (2018T2 -> hoy).
      `expedientes` cuenta todas las licencias (también los trimestres sin nº HUTB);
      `plazas` solo existe desde 2020T3.
    columns:
      - name: barrio_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_geography')
              field: barrio_id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [barrio_id, snapshot_date]

  - name: fct_tourist_dwellings_district
    description: >
      Grano: distrito municipal de Barcelona x periodo del INE (viviendas turísticas
      anunciadas en Airbnb, Booking y Vrbo, deduplicadas por el INE).
    columns:
      - name: distrito_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [distrito_id, periodo]

  - name: fct_rent_district_quarter
    description: >
      Grano: distrito x trimestre. Alquiler medio €/mes y €/m² oficial del distrito
      (Barcelona Dades, territorio Districte, periodo Trimestre, desde 2000).
    columns:
      - name: distrito_id
        data_tests:
          - not_null
          - relationships:
              to: ref('seed_barrio_mapping')
              field: distrito_id
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [distrito_id, quarter_start]
